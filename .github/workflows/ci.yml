name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install pytest
      - name: Run offline test suite
        run: python -m pytest -q

  # Termux / Android aarch64 — the primary deploy target. Runs headless on
  # a fresh Termux environment via the termux/action container.
  termux:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/termux-docker:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python + pip
        run: |
          pkg update -y
          pkg install -y python python-pip
      - name: Install pytest
        run: pip install pytest
      - name: Run offline test suite (aarch64)
        run: python -m pytest -q

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check idun/ idun_cli.py idun_mcp.py idun_multi.py tests/
