name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install pytest
      - name: Run offline test suite
        run: python -m pytest -q

  # Termux / Android aarch64 is the primary deploy target but is verified
  # locally (headless on the device) — the old ghcr.io/termux/termux-docker
  # image is no longer published, so we dropped the container job here. The
  # stdlib-only SDK runs unmodified on Termux; the ubuntu matrix above plus
  # the local `./test.sh` cover the same offline suite.

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.15.10"
      - name: Lint
        run: ruff check idun/ idun_cli.py idun_mcp.py idun_multi.py tests/
