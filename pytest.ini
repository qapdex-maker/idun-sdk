[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q
# Never descend into foreign source trees (chromium/qt/etc. live under
# ~/storage). Without this, running pytest from ~ walks 996 foreign items
# and an unrelated SystemExit in third-party tests crashes the whole run.
norecursedirs = .git .venv venv node_modules build dist *.egg-info
  /data/data/com.termux/files/home/storage
  /data/data/com.termux/files/home/.cache
  /data/data/com.termux/files/home/.hermes
