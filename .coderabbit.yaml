# CodeRabbit configuration — Idun SDK
# Policy: zero-critical-before-merge (NVIDIA-aligned), diff-scoped reviews.
reviews:
  # Only review changed files in the PR (diff-scoped) — Flow 1.
  diff_scope: true
  # Fail/flag on criticals; do not auto-merge on critical findings.
  severity_threshold: all
  # (was: critical — lowered to 'all' for a full professional review pass)
  # Auto-review on every PR + every push to an open PR.
  auto_review:
    enabled: true
    drafts: true
  # No path_filters: diff_scope already restricts to changed files. An explicit
  # allow-list here would silently skip reviews on other files (setup.py,
  # README, etc.). CodeRabbit's default block-list still applies.
  # Reduce noise: ignore known stdlib-only false positives.
  ignore:
    # We deliberately avoid requests/httpx/azure-identity (Termux/Android headless).
    - "Consider using 'requests' or 'httpx' instead of urllib"
    - "Replace urllib with httpx"
    - "Use azure-identity for authentication"
    # JSON parsing is stdlib json.loads — not a security issue here.
    - "Use a proper JSON parser"
  # Learning: store accepted ignore decisions for future reviews.
  learning:
    enabled: true
chat:
  # Let CodeRabbit answer review questions in PR comments.
  auto_reply: true
