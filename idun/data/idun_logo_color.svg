<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ig_purple" x1="48" y1="48" x2="208" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4135E9"/>
    </linearGradient>
    <linearGradient id="ig_leaf" x1="128" y1="40" x2="128" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="ig_glow" cx="0.5" cy="0.42" r="0.6">
      <stop stop-color="#312e81" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#1e1b4b" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <!-- rounded square backdrop -->
  <rect x="20" y="20" width="216" height="216" rx="48" fill="url(#ig_purple)"/>
  <rect x="20" y="20" width="216" height="216" rx="48" fill="url(#ig_glow)"/>

  <!-- Idun glyph: stylised apple knot (I for Idun) -->
  <g>
    <!-- stem -->
    <path d="M128 70 C128 58 138 50 150 52 C148 64 140 70 128 70 Z" fill="url(#ig_leaf)"/>
    <!-- body: two overlapping leaves forming an organic apple/knot -->
    <path d="M128 96
             C100 96 80 116 80 146
             C80 182 106 210 128 210
             C150 210 176 182 176 146
             C176 116 156 96 128 96 Z"
          fill="#f5f3ff" fill-opacity="0.95"/>
    <!-- inner cut: the letter I as a negative-space vertical split -->
    <rect x="120" y="110" width="16" height="86" rx="8" fill="url(#ig_purple)"/>
    <!-- small leaf accent top-left -->
    <path d="M104 108 C92 100 84 108 90 120 C102 118 108 116 104 108 Z" fill="#c4b5fd"/>
    <!-- small leaf accent bottom-right -->
    <path d="M152 188 C164 196 172 188 166 176 C154 178 148 180 152 188 Z" fill="#c4b5fd"/>
  </g>
</svg>
